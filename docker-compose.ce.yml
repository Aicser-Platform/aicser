name: aicser-ce

services:
  postgres:
    image: postgres:16-alpine
    container_name: aicser-postgres-ce
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aicser}
      POSTGRES_USER: ${POSTGRES_USER:-aicser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicser_password}
    volumes:
      - postgres_ce_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aicser} -d ${POSTGRES_DB:-aicser}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aicser-redis-ce
    volumes:
      - redis_ce_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    image: ghcr.io/aicser-platform/aicser-server-ce:${AISER_VERSION:-latest}
    container_name: aicser-server-ce
    environment:
      AISER_EDITION: community
      AISER_EDITION_LICENSE_KEY: ""
      AISER_DEPLOYMENT_MODE: self_host
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aicser}:${POSTGRES_PASSWORD:-aicser_password}@postgres:5432/${POSTGRES_DB:-aicser}
      POSTGRES_SERVER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-aicser}
      POSTGRES_USER: ${POSTGRES_USER:-aicser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicser_password}
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-change-me-local-secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-local-jwt-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-local-jwt-secret}
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_SECONDS: "604800"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENVIRONMENT: production
      DEBUG: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    volumes:
      - server_ce_uploads:/app/uploads
    ports:
      - "${SERVER_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Running CE migrations..."
        alembic -c alembic.ini upgrade ce@head
        echo "Starting Aicser CE server..."
        exec uvicorn src.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  client:
    image: ghcr.io/aicser-platform/aicser-client-ce:${AISER_VERSION:-latest}
    container_name: aicser-client-ce
    environment:
      API_TARGET: http://server:8000
      NODE_ENV: production
      NEXT_PUBLIC_EDITION: community
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_ce_data:
  redis_ce_data:
  server_ce_uploads:

networks:
  default:
    name: aicser-ce-network
    driver: bridge
