name: aiser-ee

services:
  postgres:
    # pgvector/pgvector:pg16 is the standard Postgres 16 image with the
    # pgvector extension pre-built and available (not auto-enabled -- the
    # app's own Alembic migrations run `CREATE EXTENSION IF NOT EXISTS
    # vector` conditionally). Same data format as postgres:16-alpine; this
    # only adds extension capability, existing data is unaffected.
    image: pgvector/pgvector:pg16
    container_name: aiser-postgres-ee
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiser}
      POSTGRES_USER: ${POSTGRES_USER:-aiser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiser_password}
    volumes:
      - postgres_ee_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aiser} -d ${POSTGRES_DB:-aiser}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aiser-redis-ee
    volumes:
      - redis_ee_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: aiser-keycloak-ee
    profiles:
      - keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    volumes:
      - ./keycloak/aiser-realm.json:/opt/keycloak/data/import/aiser-realm.json:ro
    ports:
      - "8080:8080"

  # Optional, opt-in self-hosted model server (CPU-only -- no GPU passthrough
  # here; see deploy notes for a GPU/vLLM setup). Off unless you explicitly
  # request the "ollama" profile:
  #   make -C deploy ee-ollama
  #   (or: docker compose -f docker-compose.ee.yml --profile ollama up -d)
  # Then point the server at it via .env:
  #   OLLAMA_BASE_URL=http://ollama:11434
  #   OLLAMA_MODEL=<tag you pulled, e.g. qwen2.5:7b>
  # and pull a model once it's up: docker exec aiser-ollama-ee ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    container_name: aiser-ollama-ee
    profiles:
      - ollama
    volumes:
      - ollama_ee_models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    restart: unless-stopped

  server:
    build: &server-build
      context: ../server
      dockerfile: Dockerfile.prod
      args:
        AISER_VERSION: ${AISER_VERSION:-1.1.1}
    container_name: aiser-server-ee
    environment: &server-env
      APP_VERSION: ${AISER_VERSION:-1.1.1}
      AISER_VERSION: ${AISER_VERSION:-1.1.1}
      AISER_EDITION: enterprise
      AISER_EDITION_LICENSE_KEY: ${AISER_EDITION_LICENSE_KEY:-}
      AISER_DEPLOYMENT_MODE: ${AISER_DEPLOYMENT_MODE:-self_host}
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-https://license.aicser.com}
      LICENSE_GRACE_PERIOD_DAYS: ${LICENSE_GRACE_PERIOD_DAYS:-30}
      LICENSE_REFRESH_INTERVAL_MINUTES: ${LICENSE_REFRESH_INTERVAL_MINUTES:-15}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiser}:${POSTGRES_PASSWORD:-aiser_password}@postgres:5432/${POSTGRES_DB:-aiser}
      # Default pool (5 + 10 overflow = 15) was getting exhausted under normal
      # feed browsing - each dashboard/chart preview card does its own live
      # DB-backed fetch, and several rendering on one feed page at once easily
      # saturates 15 connections, timing out unrelated requests platform-wide
      # (surfaced as rbac_service "QueuePool limit... connection timed out").
      # Postgres allows 100 by default; server + worker share this same pool
      # config, so 35 each leaves headroom for both plus direct/admin access.
      # Real fix is reducing concurrent live fetches (feed lazy-loading), not
      # just a bigger pool - this is deliberately a safety margin, not instead of that.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-15}
      DB_POOL_MAX_OVERFLOW: ${DB_POOL_MAX_OVERFLOW:-20}
      # Persistent LangGraph checkpointer (true clarification resume - see
      # langgraph_orchestrator.py's _get_checkpointer). Deliberately plain
      # postgresql:// (psycopg, not SQLAlchemy) - unlike DATABASE_URL above,
      # the +asyncpg dialect suffix is NOT valid here and fails to parse
      # (live-verified); _get_checkpointer() also strips it defensively if
      # someone copies the DATABASE_URL pattern by habit, but the source of
      # truth here should be correct on its own.
      LANGGRAPH_CHECKPOINT_POSTGRES_URI: postgresql://${POSTGRES_USER:-aiser}:${POSTGRES_PASSWORD:-aiser_password}@postgres:5432/${POSTGRES_DB:-aiser}
      POSTGRES_SERVER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-aiser_world_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-4.1-mini}
      AZURE_OPENAI_GPT41_API_KEY: ${AZURE_OPENAI_GPT41_API_KEY}
      AZURE_OPENAI_GPT41_ENDPOINT: ${AZURE_OPENAI_GPT41_ENDPOINT}
      AZURE_OPENAI_GPT41_API_VERSION: ${AZURE_OPENAI_GPT41_API_VERSION}
      AZURE_OPENAI_GPT41_DEPLOYMENT_NAME: ${AZURE_OPENAI_GPT41_DEPLOYMENT_NAME:-gpt-4.1-mini}
      AZURE_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_API_BASE: ${AZURE_OPENAI_ENDPOINT}
      AZURE_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:-}
      SAMPLE_DATA_DUCKDB_PATH: ${SAMPLE_DATA_DUCKDB_PATH:-}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-aiser}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_BACKEND_CLIENT_ID:-aiser-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_SECONDS: "604800"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      # Docker-internal address for the server's OWN requests to the frontend
      # (Playwright export screenshotting/printing a chrome-free /embed/*
      # route) — "client" is this compose file's frontend service name/port,
      # NOT the host-mapped 3001 above, which is unreachable from inside this
      # container. See INTERNAL_FRONTEND_URL in src/core/config.py.
      INTERNAL_FRONTEND_URL: ${INTERNAL_FRONTEND_URL:-http://client:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-Aicser}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENVIRONMENT: production
      # Swagger/ReDoc are disabled whenever ENVIRONMENT=production (see
      # src/main.py's is_production() gate) -- this is a narrow, explicit
      # opt-back-in for just the docs routes, leaving every other
      # production-only protection (encryption-key enforcement, whoami-raw/
      # auth_echo gating, etc.) intact. Set EXPOSE_API_DOCS=true in .env to
      # reach http://<host>:8001/docs.
      EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-}
      S3_PROVIDER: ${S3_PROVIDER:-aws}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY:-}
      STRIPE_PRICE_TEAM_YEARLY: ${STRIPE_PRICE_TEAM_YEARLY:-}
      # Observability: tracing/error reporting are fully-built (see
      # src/shared/observability/) but off unless set here — previously not
      # even present in this file, so operators had no visible knob to turn
      # them on. Defaults keep current (off) behavior.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-aiser-server}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Embeddings for RAG/few-shot retrieval (src/ee/modules/ai/utils/embedding_service.py).
      # Defaults to local (sentence-transformers, no key needed). Set EMBEDDING_PROVIDER to
      # azure | openai | google | gemini | openai_compat to route through a hosted/self-hosted
      # API instead -- see that file's module docstring for the env vars each one needs.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_LOCAL_MODEL: ${EMBEDDING_LOCAL_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_API_VERSION: ${EMBEDDING_API_VERSION:-}
      # Truncates a Matryoshka-capable model's native output (e.g. Qwen3-
      # Embedding's 4096-dim) to match document_chunks.embedding_vector's
      # fixed vector(384) column -- required whenever EMBEDDING_MODEL's
      # native width isn't 384, or retrieval silently loses its ANN index.
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Self-hosted / OpenAI-compatible chat models (litellm_service.py's
      # _register_private_models). Off by default -- nothing here starts a
      # model server; point these at one you already run (Ollama, vLLM, LM
      # Studio, ...). From inside this container "localhost" is the
      # container itself, not the host -- use host.docker.internal (see
      # extra_hosts below) or the model host's LAN IP. AISER_PRIVATE_MODELS
      # takes a JSON array for anything beyond one model -- see that
      # function's docstring in litellm_service.py for the full shape.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
      AISER_PRIVATE_MODELS: ${AISER_PRIVATE_MODELS:-}
      # PII scrubbing of LLM prompts/output/row samples (Presidio-backed) --
      # off by default because the NER model false-positives on ordinary
      # business text (quarter/half-year codes, cadence words, schema
      # identifiers), corrupting generated reports/SQL. Set to "true" to
      # opt in if your deployment needs PII redaction over correctness.
      AISER_PII_GATE_ENABLED: ${AISER_PII_GATE_ENABLED:-false}
      # Primary (fast/default) tier override -- makes any provider the actual
      # default model without touching the Azure config above (Azure/OpenAI
      # stay registered as BYOK/fallback options, just not the default).
      # PRIMARY_MODEL_PROVIDER=openai works for any OpenAI-compatible gateway
      # (e.g. TokenHarbor: PRIMARY_MODEL_ENDPOINT=https://tokenharbor.ai/v1,
      # PRIMARY_MODEL_DEPLOYMENT_NAME=<model id from that gateway>).
      PRIMARY_MODEL_PROVIDER: ${PRIMARY_MODEL_PROVIDER:-}
      PRIMARY_MODEL_DEPLOYMENT_NAME: ${PRIMARY_MODEL_DEPLOYMENT_NAME:-}
      PRIMARY_MODEL_API_KEY: ${PRIMARY_MODEL_API_KEY:-}
      PRIMARY_MODEL_ENDPOINT: ${PRIMARY_MODEL_ENDPOINT:-}
      PRIMARY_MODEL_API_VERSION: ${PRIMARY_MODEL_API_VERSION:-}
      # Reasoning (strong/accuracy-critical) tier override -- same shape,
      # already existed before this session. Same gateway works here too.
      REASONING_MODEL_PROVIDER: ${REASONING_MODEL_PROVIDER:-}
      REASONING_MODEL_DEPLOYMENT_NAME: ${REASONING_MODEL_DEPLOYMENT_NAME:-}
      REASONING_MODEL_API_KEY: ${REASONING_MODEL_API_KEY:-}
      REASONING_MODEL_ENDPOINT: ${REASONING_MODEL_ENDPOINT:-}
      REASONING_MODEL_API_VERSION: ${REASONING_MODEL_API_VERSION:-}
      # litellm's native OpenRouter routing (PRIMARY/REASONING_MODEL_PROVIDER=
      # openrouter) reads this directly -- was missing here entirely, so
      # setting REASONING_MODEL_PROVIDER=openrouter silently had no working
      # key to authenticate with even though it was present in .env.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ../server/alembic/versions:/app/alembic/versions
      - server_ee_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Running migrations..."
        alembic -c alembic.ini upgrade heads
        echo "Starting server with ${SERVER_WORKERS:-1} worker process(es)..."
        # Horizontal scale-out is opt-in via SERVER_WORKERS, not the default --
        # most self-hosted deployments are single-instance and a second
        # process just doubles idle memory/DB-pool usage for no benefit. Set
        # SERVER_WORKERS>1 once you actually need the extra throughput; the
        # state each request path depends on is already externalized to
        # Redis/Postgres rather than in-process memory when you do -- per-
        # provider circuit breakers (ee/modules/ai/utils/circuit_breaker.py),
        # rate limiting (src/core/middleware.py RateLimitMiddleware), org LLM
        # concurrency slots (llm_quota_service.py), and LangGraph checkpoints
        # (AsyncPostgresSaver) all already read/write a shared backend, so
        # workers agree with each other instead of each keeping its own,
        # divergent copy. Raising SERVER_WORKERS further just multiplies this
        # container's DB pool usage (DB_POOL_SIZE + DB_POOL_MAX_OVERFLOW per
        # worker) -- check Postgres max_connections headroom before going above
        # a handful, or lower DB_POOL_SIZE to compensate.
        exec uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers ${SERVER_WORKERS:-1}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ARQ background worker — evaluates alert rules (cron, every minute), runs
  # scheduled reports/BI sync/retention cleanup (see src/shared/jobs/worker.py).
  # Reuses the exact server image/env (same code must run both sides) instead of
  # a second build definition — server's /health worker heartbeat check depends
  # on this actually running, which it never was in this compose file before.
  worker:
    build: *server-build
    image: aiser-ee-server
    container_name: aiser-worker-ee
    environment: *server-env
    volumes:
      - server_ee_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    entrypoint: ["python", "-m", "arq", "src.shared.jobs.worker.WorkerSettings"]
    restart: unless-stopped

  client:
    build:
      context: ../client
      dockerfile: Dockerfile.prod
      args:
        EDITION: enterprise
        NEXT_PUBLIC_EDITION: enterprise
        AISER_VERSION: ${AISER_VERSION:-1.1.1}
        NEXT_PUBLIC_AISER_VERSION: ${AISER_VERSION:-1.1.1}
        NEXT_PUBLIC_AISER_DEPLOYMENT_MODE: ${AISER_DEPLOYMENT_MODE:-self_host}
        NEXT_PUBLIC_AI_ENABLED: ${NEXT_PUBLIC_AI_ENABLED:-true}
        NEXT_PUBLIC_AUTH_PROVIDER: ${NEXT_PUBLIC_AUTH_PROVIDER:-local}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SUPABASE_OAUTH_PROVIDERS: ${NEXT_PUBLIC_SUPABASE_OAUTH_PROVIDERS:-google}
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-aiser}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_PUBLIC_CLIENT_ID:-aiser-client}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_BUILD_CPUS: ${NEXT_BUILD_CPUS:-1}
        NEXT_BUILD_MAX_OLD_SPACE_SIZE: ${NEXT_BUILD_MAX_OLD_SPACE_SIZE:-3072}
        NEXT_PUBLIC_SSO_PROVIDER: ${NEXT_PUBLIC_SSO_PROVIDER:-}
    container_name: aiser-client-ee
    environment:
      API_TARGET: ${API_TARGET:-http://server:8000}
      NODE_ENV: production
      EDITION: enterprise
      NEXT_PUBLIC_EDITION: enterprise
      AISER_VERSION: ${AISER_VERSION:-1.1.1}
      NEXT_PUBLIC_AISER_VERSION: ${AISER_VERSION:-1.1.1}
      NEXT_PUBLIC_AISER_DEPLOYMENT_MODE: ${AISER_DEPLOYMENT_MODE:-self_host}
      NEXT_PUBLIC_AI_ENABLED: ${NEXT_PUBLIC_AI_ENABLED:-true}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_SUPABASE_OAUTH_PROVIDERS: ${NEXT_PUBLIC_SUPABASE_OAUTH_PROVIDERS:-google}
      NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-aiser}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_PUBLIC_CLIENT_ID:-aiser-client}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_SSO_PROVIDER: ${NEXT_PUBLIC_SSO_PROVIDER:-}
    ports:
      - "3001:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_ee_data:
  redis_ee_data:
  server_ee_uploads:
  ollama_ee_models:

networks:
  default:
    name: aiser-ee-network
    driver: bridge
