# Aicser Community Edition — development stack (dev-lite, low-memory standalone).
#
# Purpose:
#   Full live-reload development stack for memory-constrained environments
#   (e.g., Podman VM 4 GB shared with global-mysql ~620 MB, fitting in the remaining ~3.4 GB).
#
# Memory Budget (Total mem_limit ~3.3 GB / actual runtime usage ~1.0 - 1.5 GB):
#   - postgres:  192 MB (shared_buffers=64MB, work_mem=4MB, conn=20)
#   - redis:      48 MB (maxmemory 32mb, volatile-lru)
#   - server:    768 MB (uvicorn --reload, pool 5+5, MALLOC_ARENA_MAX=2)
#   - client:   2300 MB (next dev --turbo, node 26 max-old-space=1280, cpus=2, NEXT_LOW_MEM=1)
#
# Usage:
#   podman compose -f deploy/docker-compose.dev.lite.yml up
#   (or via make: make -C deploy dev-lite)
#
# IMPORTANT:
#   Default ports match dev-ce exactly (3000, 8000, 5432, 6379).
#   dev-ce and dev-lite MUST NOT be run at the same time.

name: aiser-dev-lite

x-client-command: &client-command
  - sh
  - -c
  - >-
    export NEXT_PUBLIC_EDITION="$${NEXT_PUBLIC_EDITION:-$${EDITION}}";
    DEPS_HASH="$$(sha256sum package.json package-lock.json 2>/dev/null | sha256sum | cut -d ' ' -f 1)";
    INSTALLED_HASH="";
    if [ -f ./node_modules/.aicser-deps-hash ]; then
      INSTALLED_HASH="$$(cat ./node_modules/.aicser-deps-hash)";
    fi;
    if [ ! -x ./node_modules/.bin/next ] || [ "$${INSTALLED_HASH}" != "$${DEPS_HASH}" ]; then
      echo "[dev-lite] node_modules volume is missing or stale; installing dependencies...";
      npm install --no-audit --no-fund;
      echo "$${DEPS_HASH}" > ./node_modules/.aicser-deps-hash;
    fi;
    node scripts/setup-ee.js;
    if [ "$${NEXT_DEV_TURBO}" = "true" ]; then
      NODE_OPTIONS="--max-old-space-size=$${NODE_MAX_OLD_SPACE_SIZE:-1280}"
      ./node_modules/.bin/next dev --turbo -H 0.0.0.0 -p $${PORT:-3000};
    else
      NODE_OPTIONS="--max-old-space-size=$${NODE_MAX_OLD_SPACE_SIZE:-1280}"
      ./node_modules/.bin/next dev --webpack -H 0.0.0.0 -p $${PORT:-3000};
    fi

services:
  postgres:
    image: postgres:15-alpine
    container_name: aiser-postgres-dev-lite
    command: postgres -c shared_buffers=64MB -c work_mem=4MB -c maintenance_work_mem=32MB -c max_connections=20 -c effective_cache_size=256MB -c max_parallel_workers_per_gather=0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiser_world_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    ports:
      - "${DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_lite_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aiser_world_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 192m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aiser-redis-dev-lite
    command: redis-server --maxmemory 32mb --maxmemory-policy volatile-lru
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_lite_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 48m
    restart: unless-stopped

  server:
    image: aiser-server:dev-lite
    build:
      context: ../server
      dockerfile: Dockerfile.dev
    container_name: aiser-server-dev-lite
    working_dir: /app
    ports:
      - "${DEV_SERVER_PORT:-8000}:8000"
      - "${DEV_DEBUG_PORT:-5678}:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../server:/app
      - pip_dev_lite_cache:/root/.cache/pip
    environment:
      # ── Edition ──────────────────────────────────────────────────────────────
      AISER_EDITION: community
      AISER_EDITION_LICENSE_KEY: ""
      AISER_DEPLOYMENT_MODE: ${AISER_DEPLOYMENT_MODE:-self_host}
      AISER_ORG_NAME: ${AISER_ORG_NAME:-Aicser}
      # ── Database ─────────────────────────────────────────────────────────────
      POSTGRES_SERVER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-aiser_world_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123}@postgres:5432/${POSTGRES_DB:-aiser_world_db}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_POOL_MAX_OVERFLOW: ${DB_POOL_MAX_OVERFLOW:-5}
      # ── Auth ─────────────────────────────────────────────────────────────────
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-here}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-${JWT_SECRET:-your-jwt-secret-here}}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      COOKIE_SECURE: "false"
      # ── Dev flags & Memory Limits ────────────────────────────────────────────
      ENVIRONMENT: development
      DEBUG: ${APP_DEBUG:-true}
      ALLOW_UNVERIFIED_JWT_IN_DEV: ${ALLOW_UNVERIFIED_JWT_IN_DEV:-true}
      MALLOC_ARENA_MAX: "2"
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
      # ── Redis ────────────────────────────────────────────────────────────────
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379
      # ── AI / LLM ─────────────────────────────────────────────────────────────
      AISER_WARM_MODELS: ${AISER_WARM_MODELS:-false}
      # ── Observability ────────────────────────────────────────────────────────
      SENTRY_DSN: ""
      # ── Email (optional) ─────────────────────────────────────────────────────
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-Aicser}
      # ── Python ───────────────────────────────────────────────────────────────
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cd /app
        if [ -z "$$ENCRYPTION_KEY" ]; then
          case "$$(echo "$${ENVIRONMENT:-development}" | tr '[:upper:]' '[:lower:]')" in
            development|dev|test|testing|local|"")
              KEY_FILE="/app/.dev_encryption_key"
              if [ ! -s "$$KEY_FILE" ]; then
                /venv/bin/python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" > "$$KEY_FILE"
                chmod 600 "$$KEY_FILE"
                echo "Generated a dev-only ENCRYPTION_KEY at $$KEY_FILE - do NOT commit this file or reuse it outside local dev."
              fi
              ENCRYPTION_KEY="$$(cat "$$KEY_FILE")"
              export ENCRYPTION_KEY
              ;;
          esac
        fi
        /venv/bin/python -m src.shared.sample_data.ensure
        echo "Running CE migrations..."
        /venv/bin/python -m alembic -c alembic.ini upgrade 2026_07_08_avatar_url_text
        exec /venv/bin/python -m uvicorn src.main:app \
          --host 0.0.0.0 \
          --port 8000 \
          --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    mem_limit: 768m
    restart: unless-stopped

  client:
    image: aiser-client:dev-lite
    build:
      context: ../client
      dockerfile: Dockerfile.dev
      args:
        EDITION: community
    container_name: aiser-client-dev-lite
    working_dir: /app
    command: *client-command
    environment:
      EDITION: community
      NEXT_PUBLIC_EDITION: community
      NEXT_PUBLIC_API_URL: http://localhost:${DEV_SERVER_PORT:-8000}
      API_TARGET: http://server:8000
      PORT: "3000"
      NEXT_DEV_TURBO: ${NEXT_DEV_TURBO:-true}
      NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-1280}
      NEXT_DEV_CPUS: ${NEXT_DEV_CPUS:-2}
      NEXT_LOW_MEM: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    ports:
      - "${DEV_CLIENT_PORT:-3000}:3000"
    volumes:
      - ../client:/app
      - client_dev_lite_node_modules:/app/node_modules
      - client_dev_lite_ee_shim:/app/src/ee
      - client_dev_lite_next:/app/.next
    depends_on:
      server:
        condition: service_healthy
    mem_limit: ${CLIENT_DEV_MEM_LIMIT:-2300m}
    restart: unless-stopped

volumes:
  postgres_dev_lite_data:
  redis_dev_lite_data:
  pip_dev_lite_cache:
  client_dev_lite_node_modules:
  client_dev_lite_ee_shim:
  client_dev_lite_next:

networks:
  default:
    name: aiser-dev-lite-network
    driver: bridge
