name: aiser-ee-self-host

services:
  postgres:
    image: postgres:16-alpine
    container_name: aiser-postgres-ee
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiser}
      POSTGRES_USER: ${POSTGRES_USER:-aiser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_ee_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aiser} -d ${POSTGRES_DB:-aiser}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aiser-redis-ee
    volumes:
      - redis_ee_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    image: ${AISER_SERVER_IMAGE:-aiser-ee-server:self-host}
    container_name: aiser-server-ee
    environment:
      AISER_EDITION: enterprise
      AISER_DEPLOYMENT_MODE: ${AISER_DEPLOYMENT_MODE:-self_host}
      AISER_EDITION_LICENSE_KEY: ${AISER_EDITION_LICENSE_KEY:?AISER_EDITION_LICENSE_KEY is required}
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-https://license.aicser.com}
      LICENSE_GRACE_PERIOD_DAYS: ${LICENSE_GRACE_PERIOD_DAYS:-3}
      LICENSE_REFRESH_INTERVAL_MINUTES: ${LICENSE_REFRESH_INTERVAL_MINUTES:-15}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiser}
      POSTGRES_SERVER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-aiser}
      POSTGRES_USER: ${POSTGRES_USER:-aiser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_SECONDS: "604800"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      ENVIRONMENT: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      SAMPLE_DATA_DUCKDB_PATH: ${SAMPLE_DATA_DUCKDB_PATH:-}

      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}

      NEXT_PUBLIC_AI_ENABLED: ${NEXT_PUBLIC_AI_ENABLED:-true}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-4.1-mini}
      AZURE_OPENAI_GPT41_API_KEY: ${AZURE_OPENAI_GPT41_API_KEY:-}
      AZURE_OPENAI_GPT41_ENDPOINT: ${AZURE_OPENAI_GPT41_ENDPOINT:-}
      AZURE_OPENAI_GPT41_API_VERSION: ${AZURE_OPENAI_GPT41_API_VERSION:-}
      AZURE_OPENAI_GPT41_DEPLOYMENT_NAME: ${AZURE_OPENAI_GPT41_DEPLOYMENT_NAME:-gpt-4.1-mini}
      AZURE_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_API_BASE: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}

      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-Aicser}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}

      STORAGE_BACKEND: ${STORAGE_BACKEND:-}
      S3_PROVIDER: ${S3_PROVIDER:-aws}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-us-east-1}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - server_ee_uploads:/app/uploads
    ports:
      - "${SERVER_PORT_HOST:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Running EE migrations..."
        alembic -c alembic.ini upgrade heads
        echo "Starting server..."
        exec uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers ${SERVER_WORKERS:-1}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  client:
    image: ${AISER_CLIENT_IMAGE:-aiser-ee-client:self-host}
    container_name: aiser-client-ee
    environment:
      API_TARGET: http://server:8000
      NODE_ENV: production
      NEXT_PUBLIC_EDITION: enterprise
      NEXT_PUBLIC_AISER_DEPLOYMENT_MODE: ${NEXT_PUBLIC_AISER_DEPLOYMENT_MODE:-self_host}
      NEXT_PUBLIC_AI_ENABLED: ${NEXT_PUBLIC_AI_ENABLED:-true}
      NEXT_PUBLIC_SSO_PROVIDER: ${NEXT_PUBLIC_SSO_PROVIDER:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_SUPABASE_OAUTH_PROVIDERS: ${NEXT_PUBLIC_SUPABASE_OAUTH_PROVIDERS:-google}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY:-}
      STRIPE_PRICE_TEAM_YEARLY: ${STRIPE_PRICE_TEAM_YEARLY:-}
    ports:
      - "${CLIENT_PORT_HOST:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_ee_data:
  redis_ee_data:
  server_ee_uploads:

networks:
  default:
    name: aiser-ee-self-host-network
    driver: bridge
