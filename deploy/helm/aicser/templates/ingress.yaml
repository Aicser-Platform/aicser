{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "aicser.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # The client's own Next.js proxy (see client/src/app/api/[...path])
          # already forwards /api/* to the server, so the ingress only needs
          # to route everything to the client — same split as docker-compose.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-client
                port:
                  number: {{ .Values.client.port }}
{{- end }}
