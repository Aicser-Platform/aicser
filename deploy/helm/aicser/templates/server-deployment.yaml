apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "aicser.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  # The HPA owns replica count once autoscaling is enabled — this is just the
  # starting point before the HPA has any metrics to act on.
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ .Values.server.image | quote }}
          command: ["/app/scripts/docker-entrypoint.sh", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.server.port }}", "--workers", "2"]
          ports:
            - containerPort: {{ .Values.server.port }}
          env:
            {{- include "aicser.serverEnv" . | nindent 12 }}
          envFrom:
            {{- include "aicser.serverEnvFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.server.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.server.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.server.readinessProbe | nindent 12 }}
          volumeMounts:
            {{- include "aicser.sharedVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "aicser.sharedVolumes" . | nindent 8 }}
