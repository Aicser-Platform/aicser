apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-client
  labels:
    {{- include "aicser.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  selector:
    app.kubernetes.io/component: client
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.client.port }}
      targetPort: {{ .Values.client.port }}
