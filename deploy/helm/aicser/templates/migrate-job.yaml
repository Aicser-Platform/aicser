{{- if .Values.migrations.enabled }}
# Runs before new server/worker pods start, once per install or upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "aicser.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ .Values.server.image | quote }}
          command: ["/app/scripts/docker-entrypoint.sh", "alembic", "-c", "alembic.ini", "upgrade", "heads"]
          env:
            {{- include "aicser.serverEnv" . | nindent 12 }}
          envFrom:
            {{- include "aicser.serverEnvFrom" . | nindent 12 }}
{{- end }}
