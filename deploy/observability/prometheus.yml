global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: aiser-api
    metrics_path: /metrics
    static_configs:
      - targets: ["chat2chart-server:8000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:8080"]
