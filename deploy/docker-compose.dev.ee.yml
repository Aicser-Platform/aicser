# Enterprise Edition development overrides.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./keycloak/aiser-realm.json:/opt/keycloak/data/import/aiser-realm.json:ro
    ports:
      - "${DEV_KEYCLOAK_PORT:-8080}:8080"
    restart: unless-stopped

  # Optional, opt-in self-hosted model server (CPU-only). Off unless you ask
  # for the "ollama" profile: make -C deploy dev-ee-ollama (or
  # `docker compose ... --profile ollama up -d ollama` directly). Then set
  # OLLAMA_BASE_URL=http://ollama:11434 in your .env and pull a model:
  # docker exec aiser-ollama-dev-ee ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    container_name: aiser-ollama-dev-ee
    profiles:
      - ollama
    volumes:
      - ollama_dev_ee_models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    restart: unless-stopped

  server:
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cd /app
        if [ -z "$$ENCRYPTION_KEY" ]; then
          case "$$(echo "$${ENVIRONMENT:-development}" | tr '[:upper:]' '[:lower:]')" in
            development|dev|test|testing|local|"")
              KEY_FILE="/app/.dev_encryption_key"
              if [ ! -s "$$KEY_FILE" ]; then
                /venv/bin/python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" > "$$KEY_FILE"
                chmod 600 "$$KEY_FILE"
                echo "Generated a dev-only ENCRYPTION_KEY at $$KEY_FILE - do NOT commit this file or reuse it outside local dev."
              fi
              ENCRYPTION_KEY="$$(cat "$$KEY_FILE")"
              export ENCRYPTION_KEY
              ;;
          esac
        fi
        /venv/bin/python -m src.shared.sample_data.ensure
        echo "Running EE migrations..."
        /venv/bin/python -m alembic -c alembic.ini upgrade heads
        if [ "$${RUN_EE_DEV_SEEDS}" = "true" ]; then
          echo "Seeding EE development data..."
          if [ -f /app/ee/scripts/seed_rbac.py ]; then
            /venv/bin/python /app/ee/scripts/seed_rbac.py
          fi
          if [ -f /app/ee/scripts/seed_deployment_org.py ]; then
            /venv/bin/python /app/ee/scripts/seed_deployment_org.py
          fi
        fi
        exec /venv/bin/python -m uvicorn src.main:app \
          --host 0.0.0.0 \
          --port 8000 \
          --reload
    environment:
      AISER_EDITION: enterprise
      AISER_EDITION_LICENSE_KEY: ${AISER_EDITION_LICENSE_KEY:-}
      RUN_EE_DEV_SEEDS: "true"
      # Plain postgresql:// (psycopg, not SQLAlchemy) - +asyncpg here fails to
      # parse and silently degraded this to MemorySaver (live-verified: the
      # error is swallowed by _get_checkpointer()'s own except-and-fall-back).
      LANGGRAPH_CHECKPOINT_POSTGRES_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123}@postgres:5432/${POSTGRES_DB:-aiser_world_db}
      AISER_CHECKPOINTER_ENABLED: ${AISER_CHECKPOINTER_ENABLED:-true}
      AISER_AI_JOB_QUEUE: ${AISER_AI_JOB_QUEUE:-false}
      AISER_ORG_LLM_CONCURRENCY: ${AISER_ORG_LLM_CONCURRENCY:-5}
      USE_LANGGRAPH_ORCHESTRATOR: ${USE_LANGGRAPH_ORCHESTRATOR:-true}
      AUTH_PROVIDER: ${NEXT_PUBLIC_AUTH_PROVIDER:-local}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-aiser}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_BACKEND_CLIENT_ID:-aiser-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-aiser-backend-dev-secret}
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY:-}
      STRIPE_PRICE_TEAM_YEARLY: ${STRIPE_PRICE_TEAM_YEARLY:-}
      AZURE_OPENAI_GPT41_API_KEY: ${AZURE_OPENAI_GPT41_API_KEY:-}
      AZURE_OPENAI_GPT41_ENDPOINT: ${AZURE_OPENAI_GPT41_ENDPOINT:-}
      AZURE_OPENAI_GPT41_API_VERSION: ${AZURE_OPENAI_GPT41_API_VERSION:-}
      AZURE_OPENAI_GPT41_DEPLOYMENT_NAME: ${AZURE_OPENAI_GPT41_DEPLOYMENT_NAME:-gpt-4.1-mini}
      # Embeddings (src/ee/modules/ai/utils/embedding_service.py). Defaults to
      # local (sentence-transformers, no key needed); set EMBEDDING_PROVIDER to
      # azure | openai | google | gemini | openai_compat to use a hosted/
      # self-hosted API instead.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_LOCAL_MODEL: ${EMBEDDING_LOCAL_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_API_VERSION: ${EMBEDDING_API_VERSION:-}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Self-hosted / OpenAI-compatible chat models (litellm_service.py's
      # _register_private_models). Off by default. From inside this container
      # "localhost" points at the container itself -- use host.docker.internal
      # (wired below via extra_hosts) for a model server running on the host,
      # or its LAN IP for one running elsewhere.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
      AISER_PRIVATE_MODELS: ${AISER_PRIVATE_MODELS:-}
      # PII scrubbing of LLM prompts/output/row samples -- off by default,
      # see docker-compose.ee.yml for why.
      AISER_PII_GATE_ENABLED: ${AISER_PII_GATE_ENABLED:-false}
      # Primary (fast/default) and reasoning (strong) tier overrides -- make
      # any OpenAI-compatible gateway (e.g. TokenHarbor) the default/reasoning
      # model without touching the Azure config above. See docker-compose.ee.yml
      # for the full explanation; same env vars here.
      PRIMARY_MODEL_PROVIDER: ${PRIMARY_MODEL_PROVIDER:-}
      PRIMARY_MODEL_DEPLOYMENT_NAME: ${PRIMARY_MODEL_DEPLOYMENT_NAME:-}
      PRIMARY_MODEL_API_KEY: ${PRIMARY_MODEL_API_KEY:-}
      PRIMARY_MODEL_ENDPOINT: ${PRIMARY_MODEL_ENDPOINT:-}
      PRIMARY_MODEL_API_VERSION: ${PRIMARY_MODEL_API_VERSION:-}
      REASONING_MODEL_PROVIDER: ${REASONING_MODEL_PROVIDER:-}
      REASONING_MODEL_DEPLOYMENT_NAME: ${REASONING_MODEL_DEPLOYMENT_NAME:-}
      REASONING_MODEL_API_KEY: ${REASONING_MODEL_API_KEY:-}
      REASONING_MODEL_ENDPOINT: ${REASONING_MODEL_ENDPOINT:-}
      REASONING_MODEL_API_VERSION: ${REASONING_MODEL_API_VERSION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_started

  client:
    image: aiser-client:dev-ee
    build:
      args:
        EDITION: enterprise
    environment:
      EDITION: enterprise
      NEXT_PUBLIC_EDITION: enterprise
      NEXT_PUBLIC_AISER_DEPLOYMENT_MODE: ${AISER_DEPLOYMENT_MODE:-self_host}
      NEXT_PUBLIC_AI_ENABLED: ${NEXT_PUBLIC_AI_ENABLED:-true}
      NEXT_PUBLIC_AUTH_PROVIDER: ${NEXT_PUBLIC_AUTH_PROVIDER:-local}
      NEXT_PUBLIC_SSO_PROVIDER: ${NEXT_PUBLIC_SSO_PROVIDER:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_SUPABASE_OAUTH_PROVIDERS: ${NEXT_PUBLIC_SUPABASE_OAUTH_PROVIDERS:-google}
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:${DEV_KEYCLOAK_PORT:-8080}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-aiser}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_PUBLIC_CLIENT_ID:-aiser-client}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      WATCHPACK_POLLING: "true"

volumes:
  ollama_dev_ee_models:
