# Dev stack: postgres, redis, chat2chart-server, optional client (ce/ee profiles).
# - Sample data: DuckDB file via ensure_sample_data (no ClickHouse required).
# - Keycloak (EE SSO): profile `ee` — http://localhost:8080, realm `aiser`.
# - ClickHouse (optional warehouse demos): profile `warehouse` only.
# - Observability (Prometheus, Grafana, OTel Collector): profile `observability`.
# - Background jobs (ARQ worker): profile `worker`.
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aiser-postgres-dev
    env_file: .env # Moved here
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiser_world_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aiser_world_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aiser-redis-dev
    env_file: .env # Moved here
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional OLAP warehouse (not required for EE dev — sample data uses DuckDB).
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: aiser-clickhouse-dev
    profiles:
      - warehouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-aiser_warehouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-aiser}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-aiser_warehouse_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_dev_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Keycloak OIDC (EE SSO) — own container, imported realm on first start.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: aiser-keycloak-dev
    profiles:
      - ee
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./keycloak/aiser-realm.json:/opt/keycloak/data/import/aiser-realm.json:ro
    ports:
      - "8080:8080"

  # Chat2Chart Server
  chat2chart-server:
    image: aiser-chat2chart-server:dev
    build:
      context: ../server
      dockerfile: Dockerfile.dev
    container_name: aiser-chat2chart-server-dev
    working_dir: /app
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "5678:5678" # Debugpy port for remote debugging
    volumes:
      - ../server:/app
      - pip_cache:/root/.cache/pip
      # Sample data: mount full tree so ensure_sample_data can run generators; DuckDB written under duckdb/
      - ./scripts/sample-data:/app/scripts/sample-data
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_DB=${POSTGRES_DB:-aiser_world_db} # Unified database
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-aiser_world_db}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - AISER_EDITION=${AISER_EDITION:-community}
      - AISER_EDITION_LICENSE_KEY=${AISER_EDITION_LICENSE_KEY:-}
      - AISER_DEPLOYMENT_MODE=${AISER_DEPLOYMENT_MODE:-self_host}
      - AISER_ORG_NAME=${AISER_ORG_NAME:-Aicser}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DEBUG=${APP_DEBUG:-true}
      - ALLOW_UNVERIFIED_JWT_IN_DEV=${ALLOW_UNVERIFIED_JWT_IN_DEV:-true}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - LANGGRAPH_CHECKPOINT_POSTGRES_URI=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-aiser_world_db}
      - AISER_CHECKPOINTER_ENABLED=${AISER_CHECKPOINTER_ENABLED:-true}
      - AISER_AI_JOB_QUEUE=${AISER_AI_JOB_QUEUE:-false}
      - AISER_ORG_LLM_CONCURRENCY=${AISER_ORG_LLM_CONCURRENCY:-5}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-5-mini}
      - AZURE_OPENAI_GPT41_API_KEY=${AZURE_OPENAI_GPT41_API_KEY}
      - AZURE_OPENAI_GPT41_ENDPOINT=${AZURE_OPENAI_GPT41_ENDPOINT}
      - AZURE_OPENAI_GPT41_API_VERSION=${AZURE_OPENAI_GPT41_API_VERSION}
      - AZURE_OPENAI_GPT41_DEPLOYMENT_NAME=${AZURE_OPENAI_GPT41_DEPLOYMENT_NAME:-gpt-4.1-mini}
      - AZURE_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_API_BASE=${AZURE_OPENAI_ENDPOINT}
      - AZURE_API_VERSION=${AZURE_OPENAI_API_VERSION}
      # Optional ClickHouse (only when --profile warehouse is active)
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-aiser_warehouse}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-aiser}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-aiser_warehouse_password}
      # Keycloak OIDC (EE SSO)
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-aiser}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_BACKEND_CLIENT_ID:-aiser-backend}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-aiser-backend-dev-secret}
      # JWT_SECRET: from Supabase Dashboard → Project Settings → API → JWT Secret (enables token verification; avoids "JWK Set did not contain any keys")
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-here}
      # ENCRYPTION_KEY: generate with python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" (encrypts data source credentials at rest)
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_STORAGE_ACCOUNT_URL=${AZURE_STORAGE_ACCOUNT_URL}
      - AZURE_STORAGE_CONTAINER_NAME=${AZURE_STORAGE_CONTAINER_NAME}
      # Sample data: path to DuckDB file (ensure_sample_data writes here on first start)
      - SAMPLE_DATA_DUCKDB_PATH=${SAMPLE_DATA_DUCKDB_PATH:-/app/scripts/sample-data/duckdb/sample_data.duckdb}
      - GENERATORS_BASE=/app/scripts/sample-data
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      - STRIPE_ENABLED=${STRIPE_ENABLED:-true}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY:-}
      - STRIPE_PRICE_PRO_YEARLY=${STRIPE_PRICE_PRO_YEARLY:-}
      - STRIPE_PRICE_TEAM_MONTHLY=${STRIPE_PRICE_TEAM_MONTHLY:-}
      - STRIPE_PRICE_TEAM_YEARLY=${STRIPE_PRICE_TEAM_YEARLY:-}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-}
      - S3_PROVIDER=${S3_PROVIDER:-aws}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      # Observability (optional — use with --profile observability)
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-aiser-api}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_TRACES_CONSOLE=${OTEL_TRACES_CONSOLE:-false}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-development}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Overwrite the default command with our entrypoint script for migrations
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -ex;
        cd /app;
        echo "Waiting for PostgreSQL to be ready...";
        until nc -z postgres 5432; do
            echo "PostgreSQL is unavailable - sleeping";
            sleep 2;
        done;

        echo "PostgreSQL is up - running migrations...";
        /venv/bin/python -m alembic -c alembic.ini upgrade heads || exit 1;
        echo "Ensuring sample data (DuckDB)...";
        if [ -f /app/scripts/ensure_sample_data.py ]; then /venv/bin/python /app/scripts/ensure_sample_data.py || true; else echo "  (ensure_sample_data.py not found, skipping)"; fi;
        echo "Seeding RBAC roles and permissions...";
        if [ -f /app/ee/scripts/seed_rbac.py ]; then /venv/bin/python /app/ee/scripts/seed_rbac.py || true; else echo "  (seed_rbac.py not found, skipping)"; fi;
        echo "Ensuring deployment organization (self-host)...";
        if [ -f /app/ee/scripts/seed_deployment_org.py ]; then /venv/bin/python /app/ee/scripts/seed_deployment_org.py || true; else echo "  (seed_deployment_org.py not found, skipping)"; fi;
        echo "Starting chat2chart-server...";
        /venv/bin/python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload;
        # Uncomment this to use debugpy
        # python -m debugpy --listen 0.0.0.0:5678 --wait-for-client -m uvicorn src.main:app --host 0.0.0.0 --port 8000;
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Community Edition client with hot reload.
  # Start with: docker compose -f deploy/docker-compose.dev.yml --profile ce up client-ce
  client-ce:
    image: aiser-client:dev-ce
    build:
      context: ../client
      dockerfile: Dockerfile.dev
      args:
        EDITION: community
    container_name: aiser-client-ce-dev
    working_dir: /app
    profiles:
      - ce
    environment:
      - EDITION=community
      - NEXT_PUBLIC_EDITION=community
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_TARGET=http://chat2chart-server:8000
      - PORT=3000
      - NEXT_DEV_TURBO=${NEXT_DEV_TURBO:-false}
      - NODE_MAX_OLD_SPACE_SIZE=${NODE_MAX_OLD_SPACE_SIZE:-2560}
      - NEXT_DEV_CPUS=${NEXT_DEV_CPUS:-}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-false}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-false}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - NEXT_PUBLIC_SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-development}
      - NEXT_PUBLIC_OTEL_ENABLED=${NEXT_PUBLIC_OTEL_ENABLED:-false}
      - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}
      - NEXT_PUBLIC_OTEL_SERVICE_NAME=${NEXT_PUBLIC_OTEL_SERVICE_NAME:-aicser-client}
    # EE-sized monorepo (Monaco, Sentry, OTel) — raise if dev still hits Next.js memory restart
    mem_limit: ${CLIENT_DEV_MEM_LIMIT:-4g}
    ports:
      - "3000:3000"
    volumes:
      - ../client:/app
      - client_ce_node_modules:/app/node_modules
      - client_ce_ee_shim:/app/src/ee
      - client_ce_next:/app/.next
    networks:
      - default
    depends_on:
      chat2chart-server:
        condition: service_healthy
    restart: unless-stopped

  # Enterprise Edition client with hot reload.
  # Start with: AISER_EDITION=enterprise docker compose -f deploy/docker-compose.dev.yml --profile ee up client-ee
  client-ee:
    image: aiser-client:dev-ee
    build:
      context: ../client
      dockerfile: Dockerfile.dev
      args:
        EDITION: enterprise
    container_name: aiser-client-ee-dev
    working_dir: /app
    profiles:
      - ee
    environment:
      - EDITION=enterprise
      - NEXT_PUBLIC_EDITION=enterprise
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_TARGET=http://chat2chart-server:8000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      - NEXT_PUBLIC_KEYCLOAK_URL=${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
      - NEXT_PUBLIC_KEYCLOAK_REALM=${KEYCLOAK_REALM:-aiser}
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${KEYCLOAK_PUBLIC_CLIENT_ID:-aiser-client}
      - PORT=3001
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      - NEXT_DEV_TURBO=${NEXT_DEV_TURBO:-false}
      - NODE_MAX_OLD_SPACE_SIZE=${NODE_MAX_OLD_SPACE_SIZE:-2560}
      - NEXT_DEV_CPUS=${NEXT_DEV_CPUS:-}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-false}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-false}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - NEXT_PUBLIC_SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-development}
      - NEXT_PUBLIC_OTEL_ENABLED=${NEXT_PUBLIC_OTEL_ENABLED:-false}
      - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT=${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}
      - NEXT_PUBLIC_OTEL_SERVICE_NAME=${NEXT_PUBLIC_OTEL_SERVICE_NAME:-aicser-client}
    # PWA: `next dev` does not register the service worker. For PWA testing use
    # docker compose -f docker-compose.ee.yml build client (production image).
    mem_limit: ${CLIENT_DEV_MEM_LIMIT:-4g}
    ports:
      - "3001:3001"
    volumes:
      - ../client:/app
      - client_ee_node_modules:/app/node_modules
      - client_ee_ee_shim:/app/src/ee
      - client_ee_next:/app/.next
    networks:
      - default
    depends_on:
      chat2chart-server:
        condition: service_healthy
    restart: unless-stopped

  # ARQ background worker (retention, alerts, scheduled reports).
  chat2chart-worker:
    image: aiser-chat2chart-server:dev
    build:
      context: ../server
      dockerfile: Dockerfile.dev
    container_name: aiser-worker-dev
    profiles:
      - worker
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ../server:/app
      - pip_cache:/root/.cache/pip
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_DB=${POSTGRES_DB:-aiser_world_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-aiser_world_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - AISER_EDITION=${AISER_EDITION:-community}
      - PYTHONPATH=/app
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_SERVICE_NAME=${OTEL_WORKER_SERVICE_NAME:-aiser-worker}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/venv/bin/python", "-m", "arq", "src.shared.jobs.worker.WorkerSettings"]
    restart: unless-stopped

  # Prometheus — scrapes chat2chart-server /metrics (profile `observability`).
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: aiser-prometheus-dev
    profiles:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dev_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

  # Grafana — dashboards for Prometheus (profile `observability`).
  grafana:
    image: grafana/grafana:11.3.0
    container_name: aiser-grafana-dev
    profiles:
      - observability
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # OpenTelemetry Collector — receives OTLP from the API (profile `observability`).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: aiser-otel-collector-dev
    profiles:
      - observability
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: aiser-postgres-exporter-dev
    profiles:
      - observability
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123}@postgres:5432/${POSTGRES_DB:-aiser_world_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: aiser-redis-exporter-dev
    profiles:
      - observability
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_dev_data:
  redis_dev_data:
  clickhouse_dev_data:
  sqlserver_dev_data:
  pip_cache:
  client_node_modules:
  client_ce_node_modules:
  client_ee_node_modules:
  client_ce_ee_shim:
  client_ee_ee_shim:
  client_ce_next:
  client_ee_next:
  prometheus_dev_data:
  grafana_dev_data:

networks:
  default:
    name: aiser-dev-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1
