# Enterprise Edition development base stack.
#
# Do not run this file directly. Use:
#   make -C deploy dev-ee
#
# CE development is fully standalone — use docker-compose.dev.ce.yml directly:
#   make -C deploy dev-ce
#   docker compose -f deploy/docker-compose.dev.ce.yml up
#
# EE overrides live in docker-compose.dev.ee.yml.
# Optional heavy services live in docker-compose.dev.extras.yml.

x-client-command: &client-command
  - sh
  - -c
  - >-
    export NEXT_PUBLIC_EDITION="$${NEXT_PUBLIC_EDITION:-$${EDITION}}";
    DEPS_HASH="$$(sha256sum package.json package-lock.json 2>/dev/null | sha256sum | cut -d ' ' -f 1)";
    INSTALLED_HASH="";
    if [ -f ./node_modules/.aicser-deps-hash ]; then
      INSTALLED_HASH="$$(cat ./node_modules/.aicser-deps-hash)";
    fi;
    if [ ! -x ./node_modules/.bin/next ] || [ "$${INSTALLED_HASH}" != "$${DEPS_HASH}" ]; then
      echo "[dev] node_modules volume is missing or stale; installing dependencies...";
      npm install --no-audit --no-fund;
      echo "$${DEPS_HASH}" > ./node_modules/.aicser-deps-hash;
    fi;
    node scripts/setup-ee.js;
    if [ "$${NEXT_DEV_TURBO}" = "true" ]; then
      NODE_OPTIONS="--max-old-space-size=$${NODE_MAX_OLD_SPACE_SIZE:-4096}"
      ./node_modules/.bin/next dev --turbo -H 0.0.0.0 -p $${PORT:-3000};
    else
      NODE_OPTIONS="--max-old-space-size=$${NODE_MAX_OLD_SPACE_SIZE:-4096}"
      ./node_modules/.bin/next dev --webpack -H 0.0.0.0 -p $${PORT:-3000};
    fi

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiser_world_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    ports:
      - "${DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aiser_world_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    image: aiser-chat2chart-server:dev
    build:
      context: ../server
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "${DEV_SERVER_PORT:-8000}:8000"
      - "${DEV_DEBUG_PORT:-5678}:5678"
    volumes:
      - ../server:/app
      - pip_cache:/root/.cache/pip
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-aiser_world_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123}@postgres:5432/${POSTGRES_DB:-aiser_world_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      AISER_EDITION: ${AISER_EDITION:-community}
      AISER_EDITION_LICENSE_KEY: ${AISER_EDITION_LICENSE_KEY:-}
      AISER_DEPLOYMENT_MODE: ${AISER_DEPLOYMENT_MODE:-self_host}
      AISER_ORG_NAME: ${AISER_ORG_NAME:-Aicser}
      RUN_EE_DEV_SEEDS: "false"
      ENVIRONMENT: development
      COOKIE_SECURE: "false"
      DEBUG: ${APP_DEBUG:-true}
      ALLOW_UNVERIFIED_JWT_IN_DEV: ${ALLOW_UNVERIFIED_JWT_IN_DEV:-true}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-here}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-${JWT_SECRET:-your-jwt-secret-here}}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_ID: ${OPENAI_MODEL_ID:-gpt-4.1-mini}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-300}
      ENABLE_CUBE: ${ENABLE_CUBE:-false}
      CUBEJS_TOKEN: ${CUBEJS_TOKEN:-}
      INTERNAL_PROVISION_SECRET: ${INTERNAL_PROVISION_SECRET:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-4.1-mini}
      AZURE_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_API_BASE: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      AISER_STRONG_MODEL: ${AISER_STRONG_MODEL:-}
      REASONING_MODEL_DEPLOYMENT_NAME: ${REASONING_MODEL_DEPLOYMENT_NAME:-}
      REASONING_MODEL_API_KEY: ${REASONING_MODEL_API_KEY:-}
      REASONING_MODEL_ENDPOINT: ${REASONING_MODEL_ENDPOINT:-}
      REASONING_MODEL_API_VERSION: ${REASONING_MODEL_API_VERSION:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-}
      SAMPLE_DATA_DUCKDB_PATH: ${SAMPLE_DATA_DUCKDB_PATH:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-Aicser}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-}
      S3_PROVIDER: ${S3_PROVIDER:-aws}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-aiser_warehouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-aiser}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-aiser_warehouse_password}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-aiser-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_CONSOLE: ${OTEL_TRACES_CONSOLE:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cd /app
        /venv/bin/python -m src.shared.sample_data.ensure
        exec /venv/bin/python -m uvicorn src.main:app \
          --host 0.0.0.0 \
          --port 8000 \
          --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  client:
    image: aiser-client:dev
    build:
      context: ../client
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: *client-command
    environment:
      EDITION: ${AISER_EDITION:-community}
      NEXT_PUBLIC_EDITION: ${AISER_EDITION:-community}
      NEXT_PUBLIC_API_URL: http://localhost:${DEV_SERVER_PORT:-8000}
      API_TARGET: http://server:8000
      PORT: "3000"
      NEXT_DEV_TURBO: ${NEXT_DEV_TURBO:-false}
      NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-4096}
      NEXT_DEV_CPUS: ${NEXT_DEV_CPUS:-}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      NEXT_PUBLIC_OTEL_ENABLED: ${NEXT_PUBLIC_OTEL_ENABLED:-false}
      NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT: ${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}
      NEXT_PUBLIC_OTEL_SERVICE_NAME: ${NEXT_PUBLIC_OTEL_SERVICE_NAME:-aicser-client}
    ports:
      - "${DEV_CLIENT_PORT:-3000}:3000"
    volumes:
      - ../client:/app
      - client_node_modules:/app/node_modules
      - client_ee_shim:/app/src/ee
      - client_next:/app/.next
    depends_on:
      server:
        condition: service_healthy
    mem_limit: ${CLIENT_DEV_MEM_LIMIT:-6g}
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:
  pip_cache:
  client_node_modules:
  client_ee_shim:
  client_next:
