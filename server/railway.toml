[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.prod"
watchPatterns = [
  "Dockerfile.prod",
  "requirements.txt",
  "pyproject.toml",
  "alembic/**",
  "src/**",
  "ee/**",
  "scripts/railway-start.sh"
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
