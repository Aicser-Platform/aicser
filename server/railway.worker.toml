[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.prod"
watchPatterns = [
  "Dockerfile",
  "Dockerfile.prod",
  "requirements.txt",
  "pyproject.toml",
  "alembic/**",
  "src/**",
  "ee/**",
  "scripts/**"
]

[deploy]
startCommand = "/app/scripts/railway-worker-start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
