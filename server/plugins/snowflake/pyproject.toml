[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicser-plugin-snowflake"
version = "1.0.0"
description = "Snowflake connector for Aicser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "snowflake-connector-python>=3.6.0",
    "snowflake-sqlalchemy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aicser_plugin_snowflake*"]

[project.entry-points."aicser.plugins"]
snowflake = "aicser_plugin_snowflake:manifest"
