[tool.poetry]
name = "aiser-world-chat2chart"
version = "0.1.0"
description = "Aiser World Chat2Chart AI Engine"
authors = ["Aicser (DataTicon) <aicser-licensing@dataticon.com>"]
license = "AGPL-3.0"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
alembic = "^1.13.0"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.23"
cryptography = "^41.0.7"
passlib = "^1.7.4"
python-jose = "^3.3.0"
email-validator = "^2.2.0"
pydantic = "^2.10.4"
pydantic-settings = "^2.7.0"
openai = "^2.44.0"
litellm = "^1.91.0"
supabase = "^2.10.0"
langchain = "^0.3.0"
langgraph = "^0.6.11"
langchain-azure-ai = "^0.1.0"
langchain-google-genai = "^0.0.1"
google-generativeai = "^0.3.1"
boto3 = "^1.26.137"
colorama = "^0.4.6"
pandas = "^2.2.3"
numpy = "^1.24.0"
pillow = "^10.0.0"
redis = "^5.0.0"
python-dotenv = "^1.0.0"
python-multipart = "^0.0.20"
openpyxl = "^3.1.2"
xlrd = "^2.0.1"
tabula-py = "^2.8.2"
pyarrow = "^14.0.2"
fastparquet = "^2024.2.0"
python-snappy = "^0.6.1"
chardet = "^5.2.0"
python-telegram-bot = "^22.0.0"
# Database Drivers
pymysql = "^1.1.0"
mysql-connector-python = "^8.2.0"
pyodbc = "^5.0.1"
oracledb = "^2.5.0"
pymongo = "^4.6.0"
elasticsearch = "^8.11.0"
influxdb-client = "^1.38.0"
neo4j = "^5.15.0"
# Data Warehouse Drivers
snowflake-connector-python = "^3.6.0"
google-cloud-bigquery = "^3.13.0"
redshift-connector = "^2.0.908"
databricks-sql-connector = "^3.0.0"
databricks-connect = "^14.0.0"
clickhouse-connect = "^0.7.0"
clickhouse-driver = "^0.2.6"
# Statistical & ML Libraries (Advanced Analytics Modes)
prophet = ">=1.1.5"
statsmodels = ">=0.14.1"
pmdarima = ">=2.0.4"
scikit-learn = ">=1.4.0"
scipy = ">=1.12.0"
mapie = ">=0.9.0"
# Document parsing for RAG knowledge base
pymupdf = ">=1.24.0"
python-docx = ">=1.1.0"
# Optional: native vector operations (graceful fallback to JSONB cosine similarity)
pgvector = {version = ">=0.3.0", optional = true}
# Additional utilities
sqlalchemy-utils = "^0.41.1"
PyYAML = "^6.0.1"
# Round-trip-safe YAML (comment-preserving) for the semantic layer definitions
"ruamel.yaml" = ">=0.18"
psutil = "^5.9.8"
python-socketio = "^5.11.0"
python-engineio = "^4.9.0"
sqlparse = "^0.4.4"
sqlglot = "^24.0.0"
aiohttp = "^3.9.1"
duckdb = "^0.9.2"
aiomysql = "^0.3.2"
aiosqlite = "^0.21.0"
aioodbc = "^0.5.0"
debugpy = "^1.8.0"
stripe = "^11.6.0"
# Optional: persistent checkpointer for production (set LANGGRAPH_CHECKPOINT_POSTGRES_URI)
langgraph-checkpoint-postgres = {version = "^3.0.0", optional = true}

[tool.poetry.extras]
checkpoint-postgres = ["langgraph-checkpoint-postgres"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "legacy_orchestrator: tests for deprecated RobustMultiAgentOrchestrator/EnhancedWorkflowPipeline (run explicitly or in legacy CI; will be migrated to LangGraph).",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
